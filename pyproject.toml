[project]
name = "mini-llm"
version = "0.1.0"
description = "A GPT-style, decoder-only language model written from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tiktoken",
    "torch>=2.2.2",
    # torch 2.2.2 is the last release with Intel-Mac wheels, and it was built against NumPy 1.x
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# needed by scripts/prepare_wikitext.py only
data = [
    "datasets",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_llm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# study/ has demo scripts named test_*.py that run at import; they are not tests
testpaths = ["tests"]
